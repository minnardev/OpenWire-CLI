name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libpipewire-0.3-dev libspa-0.2-dev libclang-dev clang libx11-dev libxtst-dev
    - name: Check
      run: cargo check --verbose
    - name: Build Release
      run: cargo build --release --verbose
    - name: Build Fallback (no default features)
      run: cargo build --release --no-default-features --verbose
